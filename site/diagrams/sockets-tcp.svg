  <rect class="diagram__box" x="20" y="36" width="300" height="38" rx="8"/><text class="diagram__text diagram__text--mono" x="170" y="60" text-anchor="middle">new ServerSocket(port)</text>
  <rect class="diagram__box diagram__box--warn" x="20" y="92" width="300" height="38" rx="8"/><text class="diagram__text diagram__text--mono" x="170" y="116" text-anchor="middle">Socket s = ss.accept()  ⏳</text>
