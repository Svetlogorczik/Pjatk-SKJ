  <rect class="diagram__box" x="440" y="160" width="300" height="38" rx="8"/><text class="diagram__text diagram__text--mono" x="590" y="184" text-anchor="middle">out.println(request); flush()</text>
  <rect class="diagram__box" x="440" y="230" width="300" height="38" rx="8"/><text class="diagram__text diagram__text--mono" x="590" y="254" text-anchor="middle">in.readLine()  ⏳</text>
