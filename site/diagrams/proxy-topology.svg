  </g>
  <rect class="diagram__box diagram__box--own" x="530" y="34" width="80" height="26" rx="13"/><text class="diagram__text diagram__text--muted" x="570" y="52" text-anchor="middle">{{client2}}</text>
  <rect class="diagram__box diagram__box--accent" x="535" y="95" width="70" height="32" rx="8"/><text class="diagram__text diagram__text--bold" x="570" y="116" text-anchor="middle">P1</text>
  <rect class="diagram__box diagram__box--accent" x="445" y="214" width="70" height="32" rx="8"/><text class="diagram__text diagram__text--bold" x="480" y="235" text-anchor="middle">P2</text>
