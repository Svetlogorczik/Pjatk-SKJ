  <circle class="diagram__box diagram__box--tip" cx="230" cy="283" r="18"/><text class="diagram__text" x="230" y="288" text-anchor="middle">c</text>
  <circle class="diagram__box diagram__box--tip" cx="310" cy="283" r="18"/><text class="diagram__text" x="310" y="288" text-anchor="middle">d</text>
